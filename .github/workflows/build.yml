name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # The NDK download occasionally gets cut off, so retry a few times
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0" && break
            [ "$attempt" = 3 ] && exit 1
            rm -rf "$ANDROID_HOME/ndk/26.3.11579264"
            sleep 10
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2

      - run: cargo install cargo-ndk --locked

      - name: Build native libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          cargo ndk -t arm64-v8a -t armeabi-v7a -o app/src/main/jniLibs build --release

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: splyce-debug-apk
          path: app/build/outputs/apk/debug/*.apk
